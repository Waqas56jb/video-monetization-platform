<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>MTONYO+ — Tanzania's Premium Creator Video Platform</title>
<meta name="description" content="Upload. Sell. Get paid before you go free. Tanzania's premium creator video platform with M-Pesa &amp; Airtel Money.">

<!-- PWA: installable on iPhone + Android -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#06060a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="MTONYO+">

<!-- iOS has no manifest support for install, so it needs its own tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MTONYO+">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

<!-- shared link previews (WhatsApp / Facebook / X) -->
<meta property="og:site_name" content="MTONYO+">
<meta property="og:type" content="video.other">
<meta property="og:title" content="MTONYO+ — Tanzania's Premium Creator Video Platform">
<meta property="og:description" content="Watch the free preview, pay with M-Pesa or Airtel Money, keep watching forever.">
<meta property="og:image" content="/icons/icon-512.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
