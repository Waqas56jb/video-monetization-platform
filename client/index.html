<!DOCTYPE html>
<html lang="en">
<head>
<script>
  /* First tap must fire the action. iPad often claims it can hover, so
     :hover lifts run on the first finger press and the click misses. */
  (function () {
    try {
      var coarse = window.matchMedia('(hover: none), (pointer: coarse)').matches
      if (coarse || navigator.maxTouchPoints > 1) {
        document.documentElement.classList.add('is-touch')
      }
    } catch (e) {}
  })()
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>MTONYO+ — Tanzania's Premium Creator Video Platform</title>
<meta name="description" content="Upload. Sell. Get paid before you go free. Tanzania's premium creator video platform with M-Pesa &amp; Airtel Money.">

<!-- PWA: installable on iPhone + Android -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#06060a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="MTONYO+">

<!-- iOS has no manifest support for install, so it needs its own tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MTONYO+">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

<!-- shared link previews (WhatsApp / Facebook / X)
     og:image must be an absolute URL — crawlers drop a root-relative one, which
     is why shared links showed a card with no picture. /watch/:slug is served by
     api/watch.js, which replaces the title, description and image with the
     video's own; these are the platform-level fallbacks for every other page.
     Change the host here when the site moves to its final domain. -->
<meta property="og:site_name" content="MTONYO+">
<meta property="og:type" content="website">
<meta property="og:title" content="MTONYO+ — Tanzania's Premium Creator Video Platform">
<meta property="og:description" content="Watch the free preview, pay to continue, keep it in your library.">
<meta property="og:image" content="https://video-monetization-platform-chi.vercel.app/icons/icon-512.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://video-monetization-platform-chi.vercel.app/icons/icon-512.png">

<!-- The API. Every screen's first request goes here, and it was the one host
     with no warm connection: DNS, TCP and TLS were all being paid after the
     bundle had already parsed and asked for data. On a phone on mobile data
     that handshake is most of the wait before anything appears. -->
<link rel="dns-prefetch" href="https://video-monetization-platform-production.up.railway.app">
<link rel="preconnect" href="https://video-monetization-platform-production.up.railway.app" crossorigin>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link rel="preconnect" href="https://iframe.videodelivery.net" crossorigin>
<link rel="preconnect" href="https://embed.cloudflarestream.com" crossorigin>
<!-- The manifest, every video segment and the player's own 351 KB bundle all
     come from cloudflarestream.com. This was previously labelled as
     videodelivery.net, which the embed does not use for media at all — so the
     one origin on the critical path was the one being warmed nowhere, and its
     handshake was paid cold on every visit. -->
<link rel="preconnect" href="https://cloudflarestream.com" crossorigin>
<!-- ...but not from the apex. Traced on production, every one of those requests
     goes to the account's own delivery subdomain:

       1047  301  customer-cc4ktuo0mu0ig5dj.cloudflarestream.com/embed/sdk-iframe-integration…js
       2080  200  (same, after the redirect)  <- 1033 ms for one script
       2483  200  embed/925…chunk.js + embed/10…chunk.js
       3117  200  …/audio/13… and …/video/24…  <- every media segment

     Preconnect is per-origin, so the apex hint above warms nothing for these.
     The origin doing all the work was the one origin never being warmed — the
     same mistake as the videodelivery.net one this comment already records,
     one level further down.

     The subdomain is account-specific and opaque, and it is public: it appears
     in every network log of every play. Hardcoded because it cannot be derived
     from the playback URL, which names iframe.videodelivery.net instead. If the
     account ever changes, the cost of this being stale is one wasted DNS
     lookup — a hint that misses is not an error. -->
<link rel="preconnect" href="https://customer-cc4ktuo0mu0ig5dj.cloudflarestream.com" crossorigin>
<link rel="dns-prefetch" href="https://customer-cc4ktuo0mu0ig5dj.cloudflarestream.com">
<!-- videodelivery.net is still the poster host, fetched first-party by Watch. -->
<link rel="preconnect" href="https://videodelivery.net" crossorigin>
<link rel="dns-prefetch" href="https://videodelivery.net">
<link rel="preload" as="script" href="https://embed.cloudflarestream.com/embed/sdk.latest.js">
<script src="https://embed.cloudflarestream.com/embed/sdk.latest.js" async data-cf-stream-sdk="1"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<style>
  html,body,#root{background:#06060a;color:#f4f4f8;margin:0;min-height:100%}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
